plugins {
    id 'fabric-loom' version '1.18.1'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // MixinExtras
    modImplementation 'io.github.llamalad7:mixinextras-fabric:0.5.5'
    annotationProcessor 'io.github.llamalad7:mixinextras-fabric:0.5.5'
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'vcore_client_test'
        enableGameTests = false
        enableClientGameTests = true
        clearRunDirectory = false
    }
}

sourceSets.named('gametest') {
    java.setSrcDirs(["src/clientTest/java"])
    resources.setSrcDirs(["src/clientTest/resources"])
}

loom {
    mods {
        vcore {
            sourceSet sourceSets.main
        }
    }
    accessWidenerPath = file('src/main/resources/Vcore.accesswidener')
    runs {
        clientGameTest {
            property 'fabric.client.gametest.modid', 'vcore_client_test'
            property 'fabric.client.gametest.testModResourcesPath', file("src/clientTest/resources").absolutePath
            vmArg "-XX:TieredStopAtLevel=1"
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    exclude 'baritone/**'
}
