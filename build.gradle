plugins {
    id 'fabric-loom' version '1.18.1'
    id 'maven-publish'
}

def resolveGitShortSha() {
    def envSha = System.getenv("GITHUB_SHA")
    if (envSha != null && envSha.length() >= 7) {
        return envSha.substring(0, 7)
    }
    try {
        def stdout = new ByteArrayOutputStream()
        def proc = ["git", "rev-parse", "--short", "HEAD"].execute(null, rootDir)
        proc.consumeProcessOutput(stdout, new ByteArrayOutputStream())
        if (proc.waitFor() == 0) {
            def sha = stdout.toString().trim()
            if (!sha.isEmpty()) return sha
        }
    } catch (Throwable ignored) {}
    return "local"
}

def resolveBuildNumber() {
    def envRun = System.getenv("GITHUB_RUN_NUMBER")
    if (envRun != null && !envRun.trim().isEmpty()) {
        return envRun.trim()
    }
    try {
        def stdout = new ByteArrayOutputStream()
        def proc = ["git", "rev-list", "--count", "HEAD"].execute(null, rootDir)
        proc.consumeProcessOutput(stdout, new ByteArrayOutputStream())
        if (proc.waitFor() == 0) {
            def count = stdout.toString().trim()
            if (!count.isEmpty()) return count
        }
    } catch (Throwable ignored) {}
    return "0"
}

version = "${project.mod_version}-b${resolveBuildNumber()}-${resolveGitShortSha()}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // MixinExtras
    modImplementation 'io.github.llamalad7:mixinextras-fabric:0.5.5'
    annotationProcessor 'io.github.llamalad7:mixinextras-fabric:0.5.5'
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'vcore_client_test'
        enableGameTests = false
        enableClientGameTests = true
        clearRunDirectory = false
    }
}

sourceSets.named('gametest') {
    java.setSrcDirs(["src/clientTest/java"])
    resources.setSrcDirs(["src/clientTest/resources"])
}

loom {
    mods {
        vcore {
            sourceSet sourceSets.main
        }
    }
    accessWidenerPath = file('src/main/resources/Vcore.accesswidener')
    runs {
        clientGameTest {
            property 'fabric.client.gametest.modid', 'vcore_client_test'
            property 'fabric.client.gametest.testModResourcesPath', file("src/clientTest/resources").absolutePath
            property 'fabric.client.gametest.disableNetworkSynchronizer', 'true'
            vmArg "-XX:TieredStopAtLevel=1"
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    exclude 'baritone/**'
}

task verifyMixins(type: JavaExec) {
    group = 'verification'
    description = 'Verifies that all mixin targets exist in vanilla Minecraft 1.21.11.'
    classpath = sourceSets.gametest.runtimeClasspath
    mainClass = 'vcore.test.MixinVerificationEngine'
}

task testArchitecture(type: JavaExec) {
    group = 'verification'
    description = 'Verifies reflection elimination, KeyboardUtility, EnumConverter, and direct Module registration.'
    classpath = sourceSets.gametest.runtimeClasspath
    mainClass = 'vcore.test.ArchitectureRefactorTest'
}

task testClient100(type: JavaExec) {
    group = 'verification'
    description = 'Runs the 100 comprehensive client integration and logic tests for OpenVCore.'
    classpath = sourceSets.gametest.runtimeClasspath
    mainClass = 'vcore.test.VCoreClient100TestSuite'
}
