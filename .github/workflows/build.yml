name: Build and Release JAR

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract version metadata
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          MOD_VER=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
          FULL_VER="${MOD_VER}-b${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "mod_ver=${MOD_VER}" >> $GITHUB_OUTPUT
          echo "full_ver=${FULL_VER}" >> $GITHUB_OUTPUT

      - name: Build usable mod JAR
        run: ./gradlew remapJar --no-daemon

      - name: Prepare release artifacts
        run: |
          rm -f build/libs/*-sources.jar build/libs/*-dev.jar
          ls -la build/libs/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.vars.outputs.full_ver }}
          name: "OpenVCore v${{ steps.vars.outputs.full_ver }}"
          body: |
            **Version:** `${{ steps.vars.outputs.full_ver }}`
            **Build Number:** `#${{ github.run_number }}`
            **Commit:** ${{ github.sha }}

            Download the usable mod JAR (`OpenVCore-${{ steps.vars.outputs.full_ver }}.jar`) below.
          files: build/libs/*.jar
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
