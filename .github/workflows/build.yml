name: Build and Release JAR

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build usable mod JAR
        run: ./gradlew remapJar --no-daemon

      - name: Prepare release artifacts
        run: |
          rm -f build/libs/*-sources.jar build/libs/*-dev.jar
          ls -la build/libs/

      - name: Extract short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ steps.vars.outputs.short_sha }}
          name: "OpenVCore Build #${{ github.run_number }} (${{ steps.vars.outputs.short_sha }})"
          body: |
            Automated build from commit ${{ github.sha }}
            Download the usable mod JAR (`OpenVCore-1.0.jar`) below.
          files: build/libs/*.jar
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
